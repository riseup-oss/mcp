name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! out=$(npm view "@riseup-oss/mcp@$version" version 2>&1); then
            if ! grep -q E404 <<< "$out"; then
              echo "::error::npm view failed: $out"; exit 1
            fi
            out=""
          fi

          if [ -n "$out" ]; then
            should_publish=false
            echo "$version is already on npm"
          else
            case "$version" in
              *-*) echo "::error::Prerelease $version - publish it by hand with --tag next"; exit 1 ;;
            esac
            latest=$(npm view @riseup-oss/mcp dist-tags.latest)
            highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)
            if [ "$highest" != "$version" ]; then
              echo "::error::$version is lower than latest on npm ($latest)"; exit 1
            fi
            should_publish=true
            echo "Will publish $version (latest on npm: $latest)"
          fi
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
            should_release=false
          elif grep -q 'HTTP 404' <<< "$out"; then
            should_release=true
          else
            echo "::error::Checking GitHub release failed: $out"; exit 1
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

          if [ "$should_publish" = true ] || [ "$should_release" = true ]; then
            grep -qF "version: '$version'," src/index.ts \
              || { echo "::error::serverInfo version in src/index.ts isn't $version"; exit 1; }
            grep -qF "## [$version]" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          fi

  build:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: riseup-oss-mcp-${{ needs.check.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g --ignore-scripts npm@11.21.1
      - run: npm publish "riseup-oss-mcp-${{ needs.check.outputs.version }}.tgz"

  release:
    needs: [check, publish]
    if: >-
      always() &&
      needs.check.outputs.should_release == 'true' &&
      (needs.publish.result == 'success' || needs.check.outputs.should_publish == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
